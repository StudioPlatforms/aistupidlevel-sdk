model: auto-value
label:
  en_US: Auto Value
  zh_Hans: 自动·性价比
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 65536
    help:
      en_US: Upper limit on the length of the answer, including reasoning tokens on reasoning models.
      zh_Hans: 生成结果长度的上限（推理模型包含推理 token）。
