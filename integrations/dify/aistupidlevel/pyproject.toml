[project]
name = "dify-plugin-aistupidlevel"
version = "0.0.1"
description = "AI Stupid Level Smart Router model provider for Dify"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dify_plugin>=0.10.2,<0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
