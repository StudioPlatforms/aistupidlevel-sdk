[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aistupidlevel"
dynamic = ["version"]
description = "Client for the AI Stupid Level Smart Router: one OpenAI-compatible endpoint that routes every request to the model measuring best for it, with your own provider keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "AI Stupid Level", email = "hello@aistupidlevel.info" }]
keywords = ["llm", "router", "ai", "openai", "anthropic", "gemini", "deepseek", "model-routing", "benchmarks", "byok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://aistupidlevel.info/router"
Documentation = "https://aistupidlevel.info/router/docs#sdks"
Source = "https://github.com/StudioPlatforms/aistupidlevel-sdk"
Issues = "https://github.com/StudioPlatforms/aistupidlevel-sdk/issues"

[tool.hatch.version]
path = "src/aistupidlevel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aistupidlevel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
