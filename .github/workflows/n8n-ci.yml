name: n8n node CI

on:
  pull_request:
    paths: ['packages/n8n-nodes-aistupidlevel/**', '.github/workflows/n8n-*.yml']
  push:
    branches: [main]
    paths: ['packages/n8n-nodes-aistupidlevel/**', '.github/workflows/n8n-*.yml']

concurrency:
  group: n8n-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/n8n-nodes-aistupidlevel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/n8n-nodes-aistupidlevel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
